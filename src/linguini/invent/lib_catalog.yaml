    import_roots: [bs4]
    purpose_tags: [html, parse, grounding, docs]
    network: false
  - name: lxml
    import_roots: [lxml]
    purpose_tags: [html, xml, parse]
    network: false
  - name: httpx
    import_roots: [httpx]
    purpose_tags: [http, fetch, grounding]
    network: true
  - name: requests
    import_roots: [requests]
    purpose_tags: [http, fetch]
    network: true
  - name: markdown-it-py
