# Curated PyPI allowlist for invention. With policy.allow_open_pip, plans may
# also request packages outside this list (still name-sanitized + forge_venv only).
packages:
  - name: pyyaml
    import_roots: [yaml]
    purpose_tags: [config, parse, data]
    network: false
  - name: pydantic
    import_roots: [pydantic]
    purpose_tags: [schema, validate, data]
    network: false
