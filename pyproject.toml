[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linguini"
version = "0.1.2"
description = "NLP suite + tooling library that forges native novel tools ad hoc (ground → lean-back/chain → verify → persist)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ehallford11714" }]
keywords = ["nlp", "mcp", "tool-forge", "agents", "sandbox"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]
mcp = ["mcp>=1.0"]
spacy = ["spacy>=3.0"]
hf = ["transformers>=4.0", "torch"]
gensim = ["gensim>=4.0"]
nltk = ["nltk>=3.8"]
all = ["linguini[dev,mcp,spacy,hf,gensim,nltk]"]

[project.scripts]
linguini = "linguini.cli:main"
linguini-mcp = "linguini.mcp.server:main"

[project.urls]
Homepage = "https://github.com/ehallford11714/linguini"
Repository = "https://github.com/ehallford11714/linguini"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linguini = ["mcp/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
